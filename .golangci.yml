version: "2"
linters:
  default: standard
  exclusions:
    # build/ is Wails' own scaffolding, regenerated by `wails3 task common:update:build-assets`
    # and by `wails3 init`. Fixing what it reports here would be undone by the next update.
    paths:
      - build
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - build
