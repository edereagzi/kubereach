name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # main.go embeds frontend/dist; this job never builds the frontend.
      - run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
      - run: go test ./...

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
      # Only the service package is compiled here, so no GTK/WebKit is needed.
      - run: go test -tags e2e -run E2E ./internal/service/

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3
      - run: wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: kubereach-${{ runner.os }}
          path: bin/
