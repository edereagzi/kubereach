name: Release

# Pushing a v* tag builds all platforms and publishes a GitHub Release, with
# the signed update.json that installed releases update themselves from.
# Updating the Homebrew cask, Scoop manifest (both in edereagzi/homebrew-tap)
# and winget is disabled until builds are signed.
#
# Secrets:
#   UPDATE_SIGNING_KEY  Ed25519 private key (PEM) whose public half is built into Kubereach; signs update.json's files
#   TAP_GITHUB_TOKEN    fine-grained PAT with contents:write on edereagzi/homebrew-tap (disabled step)
#   WINGET_TOKEN        classic PAT with public_repo; wingetcreate forks microsoft/winget-pkgs and opens the PR (disabled step)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # @version installs outside this module, whose go.sum lacks the CLI's dependencies; the version follows go.mod.
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
      - run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          mkdir dist
      - name: Stamp the tag into the generated build assets
        run: wails3 update build-assets -config build/config.yml -dir build -name kubereach -binaryname kubereach -productversion "$VERSION" -silent

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: wails3 task darwin:package:universal
      # Disabled until a Developer ID certificate and notarization profile are in secrets (see `wails3 setup`).
      - name: Sign and notarize macOS app (disabled)
        if: false && runner.os == 'macOS'
        run: wails3 task darwin:sign:notarize
      - if: runner.os == 'macOS'
        run: |
          mv bin/kubereach.app bin/Kubereach.app
          # --norsrc: extended attributes would be stored as ._ files, which the updater's unzip writes into the bundle.
          ditto -c -k --norsrc --keepParent bin/Kubereach.app dist/kubereach_darwin_universal.zip

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          wails3 build
          mkdir stage
          cp bin/kubereach build/release/kubereach.desktop stage/
          cp build/appicon.png stage/kubereach.png
          tar -czf "dist/kubereach_linux_$(dpkg --print-architecture).tar.gz" -C stage .
          # The updater replaces the running binary with this one; the tarball is for install.sh.
          cp bin/kubereach "dist/kubereach_linux_$(dpkg --print-architecture)"

      # windows-latest no longer ships NSIS, which builds the installer.
      - if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Build Windows binary and installer
        if: runner.os == 'Windows'
        run: wails3 task windows:package
      # Disabled until a code-signing certificate is in secrets (see `wails3 setup`).
      - name: Sign Windows binary and installer (disabled)
        if: false && runner.os == 'Windows'
        run: wails3 tool sign --input bin/kubereach.exe && wails3 tool sign --input bin/kubereach-amd64-installer.exe
      - if: runner.os == 'Windows'
        run: |
          mv bin/kubereach-amd64-installer.exe dist/kubereach_windows_amd64_installer.exe
          (cd bin && 7z a ../dist/kubereach_windows_amd64.zip kubereach.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          (cd dist && sha256sum -- * > checksums.txt)
      # The release's feat and fix commits, as the release page and the update window show them.
      - name: Write the release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          {
            git log --format=%s "$prev..$GITHUB_REF_NAME" |
              awk 'match($0, /^(feat|fix)(\([^)]*\))?!?: /) { s = substr($0, RLENGTH + 1); print "- " toupper(substr(s, 1, 1)) substr(s, 2) }'
            echo
            echo "[All changes since ${prev#v}](https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME)"
          } > "$RUNNER_TEMP/notes.md"
      # A draft until update.json is attached, so latest/download/update.json never points at a release without one.
      # A rerun starts over from scratch, replacing the draft a failed run left; a published release is never touched.
      - run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Kubereach $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --draft
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sign the update manifest and publish
        run: |
          build/release/update-manifest.sh "$VERSION" dist "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/update.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/update.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      # Disabled until builds are signed: package managers would reject or flag unsigned builds.
      - name: Render package manifests (disabled)
        if: false
        run: build/release/render.sh "$VERSION" dist out
      - name: Upload winget manifests (disabled)
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: winget
          path: out/winget/

      - name: Check out the tap (disabled)
        if: false
        uses: actions/checkout@v4
        with:
          repository: edereagzi/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Update Homebrew cask and Scoop manifest (disabled)
        if: false
        run: |
          mkdir -p tap/Casks tap/bucket
          cp out/kubereach.rb tap/Casks/kubereach.rb
          cp out/kubereach.json tap/bucket/kubereach.json
          cd tap
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -m "kubereach $VERSION"
          git push

  # Disabled until builds are signed, like the tap update above.
  winget:
    if: false
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winget
          path: winget
      - run: |
          curl -sSLo wingetcreate.exe https://aka.ms/wingetcreate/latest
          ./wingetcreate.exe submit --token "$WINGET_TOKEN" winget
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
